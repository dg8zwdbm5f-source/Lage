<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Musculação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16181A; --panel:#1E2124; --panel-2:#262A2D; --line:#33383C;
    --text:#ECE9E4; --text-dim:#8D9399; --accent:#E3A33B; --accent-dim:#7A5A22;
    --ok:#6FA88A; --rest:#C4573F;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; }
  body{ padding-bottom:78px; }
  .mono{ font-family:'JetBrains Mono',monospace; }

  header.top{
    padding:12px 14px 10px; border-bottom:1px solid var(--line);
    background:#16181A; position:sticky; top:0; z-index:20;
  }
  .brand-row{ display:flex; align-items:center; justify-content:space-between; }
  header.top h1{ font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:0.05em; margin:0; }
  header.top h1 span{ color:var(--accent); }
  .sub-row{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
  .sub{ font-size:11px; color:var(--text-dim); }
  .eta{ font-family:'JetBrains Mono',monospace; font-size:11px; text-align:right; color:var(--text-dim); white-space:nowrap; }
  .eta b{ color:var(--accent); font-size:13px; }
  .freq-track{ display:flex; gap:3px; margin-top:8px; }
  .freq-track .dot{ flex:1; height:4px; border-radius:2px; background:var(--line); }
  .freq-track .dot.hit{ background:var(--accent); }

  .tabbar{ display:flex; gap:4px; flex:0 0 auto; }
  .tabbar button{
    background:none; border:1px solid var(--line); color:var(--text-dim); font-size:10px; padding:5px 9px; border-radius:7px;
    font-family:'Inter',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; cursor:pointer;
  }
  .tabbar button.active{ color:var(--accent); background:rgba(227,163,59,0.12); border-color:var(--accent-dim); }

  nav.days{ display:flex; gap:6px; padding:10px 14px 0; overflow-x:auto; }
  nav.days button{
    flex:0 0 auto; padding:7px 12px; border-radius:999px; border:1px solid var(--line);
    background:var(--panel); color:var(--text-dim); font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  nav.days button.active{ background:var(--accent); color:#20180A; border-color:var(--accent); }

  main{ padding:10px 14px 6px; }
  .day-title{ display:flex; align-items:baseline; justify-content:space-between; margin:8px 2px 8px; }
  .day-title h2{ font-family:'Bebas Neue',sans-serif; font-size:19px; margin:0; letter-spacing:0.03em; }
  .day-title .tag{ font-size:10px; color:var(--text-dim); text-transform:uppercase; }

  .ex-card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:8px; }
  .ex-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .ex-name{ font-size:14px; font-weight:700; line-height:1.2; }
  .ex-meta{ display:flex; align-items:center; gap:5px; margin-top:2px; }
  .ex-target覆{ font-size:11px; color:var(--text-dim); }
  .ex-target{ font-size:11px; color:var(--text-dim); }
  .icon{ font-size:11px; }
  .pr-pill{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-dim); white-space:nowrap; }
  .pr-pill b{ color:var(--accent); }

  .ex-controls{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:12px; padding-top:10px; border-top:1px solid var(--line); }
  
  .load-input-wrap{ display:flex; align-items:center; gap:4px; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:6px 10px; width:100px; flex-shrink:0; }
  .load-input-wrap input{ width:100%; background:transparent; border:none; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:700; text-align:center; padding:0; }
  .load-input-wrap input:focus{ outline:none; }
  .load-input-wrap .unit{ font-size:11px; color:var(--text-dim); font-weight:700; }

  .series-row{ display:flex; gap:6px; flex:1; justify-content:flex-end; }
  .btn-series{
    display:flex; align-items:center; justify-content:center;
    width:38px; height:36px; background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    cursor:pointer; font-weight:700; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim);
  }
  .btn-series.done{ background:var(--ok); border-color:var(--ok); color:#0F1A15; }

  .rest-bar{
    position:fixed; left:14px; right:14px; bottom:80px; z-index:35;
    background:var(--rest); color:#231210; border-radius:12px; padding:10px 14px;
    display:none; align-items:center; justify-content:space-between; font-weight:700;
    box-shadow:0 6px 20px rgba(0,0,0,0.35);
  }
  .rest-bar.show{ display:flex; }
  .rest-bar .lbl{ font-size:12px; text-transform:uppercase; letter-spacing:0.04em; }
  .rest-bar .time{ font-family:'JetBrains Mono',monospace; font-size:20px; }

  .finish-bar{
    position:fixed; left:0; right:0; bottom:0; padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, transparent, var(--bg) 25%); display:flex; gap:8px; z-index:25;
  }
  .finish-bar button{ flex:1; padding:12px; border-radius:11px; border:none; font-weight:700; font-size:13px; cursor:pointer; }
  .btn-primary{ background:var(--accent); color:#20180A; }
  .btn-primary:disabled{ opacity:0.35; }
  .btn-ghost{ background:var(--panel); color:var(--text); border:1px solid var(--line) !important; flex:0 0 42px !important; font-size:15px !important; }

  .view{ display:none; }
  .view.active{ display:block; }

  /* Novas classes para o Histórico gerenciável */
  .hist-item{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; }
  .hist-top{ display:flex; justify-content:space-between; align-items:flex-start; border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:8px; }
  .hist-item .d{ font-size:11px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; }
  .hist-item .n{ font-size:15px; font-weight:700; color:var(--accent); margin-top:2px; }
  .hist-details{ font-size:12px; display:flex; flex-direction:column; gap:5px; }
  .hist-ex-row{ display:flex; justify-content:space-between; background:var(--panel-2); padding:6px 10px; border-radius:6px; border:1px solid rgba(255,255,255,0.02); }
  .btn-del{ background:rgba(196,87,63,0.15); border:1px solid var(--rest); color:#ff6b6b; font-size:11px; font-weight:bold; cursor:pointer; padding:4px 8px; border-radius:6px; text-transform:uppercase; }

  /* Elementos da Aba Progresso */
  .pr-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
  .pr-card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; cursor:pointer; transition:all 0.2s ease; }
  .pr-card.selected{ border-color:var(--accent); background:rgba(227,163,59,0.06); }
  .pr-card .n{ font-size:12px; color:var(--text-dim); margin-bottom:6px; line-height:1.3; min-height:32px; font-weight:500; }
  .pr-card .k{ font-family:'JetBrains Mono',monospace; font-size:18px; color:var(--accent); font-weight:700; }

  .chart-container{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:16px; display:none; }
  .chart-container.show{ display:block; }
  .chart-title{ font-size:13px; font-weight:700; margin-bottom:10px; color:var(--accent); text-transform:uppercase; letter-spacing:0.02em; }
  canvas{ width:100%; height:160px; background:var(--panel-2); border-radius:8px; margin-top:4px; }

  .empty{ text-align:center; padding:40px 20px; color:var(--text-dim); font-size:13px; }
  .toast{
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--ok); color:#0F1A15; padding:9px 16px; border-radius:999px; font-weight:700; font-size:12px;
    transition:all 0.25s ease; z-index:40; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header class="top">
  <div class="brand-row">
    <h1>MUSCULA<span>ÇÃO</span></h1>
    <div class="tabbar">
      <button data-tab="treino" class="active">Treino</button>
      <button data-tab="historico">Histórico</button>
      <button data-tab="prs">Progresso</button>
    </div>
  </div>
  <div class="sub-row">
    <span class="sub">Upper/Lower — 4x semana</span>
    <div class="eta" id="etaBox">termino ~ <b id="etaTime">--:--</b></div>
  </div>
  <div class="freq-track" id="freqTrack"></div>
</header>

<div id="view-treino" class="view active">
  <nav class="days" id="dayNav"></nav>
  <main>
    <div class="day-title">
      <h2 id="dayTitle"></h2>
      <span class="tag" id="dayTag"></span>
    </div>
    <div id="exList"></div>
  </main>
</div>

<div id="view-historico" class="view">
  <main>
    <div class="day-title"><h2>Histórico de Treinos</h2></div>
    <div id="histList"></div>
  </main>
</div>

<div id="view-prs" class="view">
  <main>
    <div class="day-title"><h2>Análise de Progresso</h2></div>
    
    <div class="chart-container" id="chartContainer">
      <div class="chart-title" id="chartExName">Selecione um exercício abaixo</div>
      <canvas id="progChart"></canvas>
    </div>

    <div class="pr-grid" id="prGrid"></div>
  </main>
</div>

<div class="rest-bar" id="restBar">
  <span class="lbl">Descanso — toque para pular</span>
  <span class="time mono" id="restTime">1:30</span>
</div>

<div class="finish-bar" id="finishBar">
  <button class="btn-ghost" id="resetDayBtn">↺</button>
  <button class="btn-primary" id="finishBtn">Concluir treino de hoje</button>
</div>

<div class="toast" id="toast"></div>

<script>
const REST_SECONDS = 90;
const EXEC_SECONDS = 30;

const DAYS = [
  { id:'d1', label:'D1', name:'Upper A', tag:'Peito / Costas — força',
    exercises:[
      {id:'d1e1', name:'Supino reto barra', target:'4x 6-8', sets:4},
      {id:'d1e2', name:'Remada curvada barra', target:'4x 6-8', sets:4},
      {id:'d1e3', name:'Desenvolvimento militar halteres', target:'3x 8-10', sets:3},
      {id:'d1e4', name:'Puxada frente aberta', target:'3x 8-10', sets:3},
      {id:'d1e5', name:'Crucifixo inclinado halteres', target:'3x 10-12', sets:3},
      {id:'d1e6', name:'Rosca direta barra W', target:'3x 10-12', sets:3},
      {id:'d1e7', name:'Tríceps corda', target:'3x 10-12', sets:3},
      {id:'d1e8', name:'Prancha + infra', target:'3x', sets:3, core:true},
    ]},
  { id:'d2', label:'D2', name:'Lower A', tag:'Quadríceps + unilateral',
    exercises:[
      {id:'d2e1', name:'Agachamento livre', target:'4x 6-8', sets:4},
      {id:'d2e2', name:'Afundo búlgaro', target:'3x 8-10/perna', sets:3, leg:true},
      {id:'d2e3', name:'Leg press unilateral', target:'3x 10-12/perna', sets:3, leg:true},
      {id:'d2e4', name:'Cadeira extensora', target:'3x 12-15', sets:3},
      {id:'d2e5', name:'Cadeira flexora', target:'3x 12-15', sets:3},
      {id:'d2e6', name:'Elevação pélvica', target:'3x 10-12', sets:3},
      {id:'d2e7', name:'Panturrilha em pé', target:'4x 12-15', sets:4},
      {id:'d2e8', name:'Abdominal oblíquo', target:'3x 15', sets:3, core:true},
    ]},
  { id:'d3', label:'D3', name:'Upper B', tag:'Ombros / Costas — volume',
    exercises:[
      {id:'d3e1', name:'Barra fixa / puxada supinada', target:'4x 6-10', sets:4},
      {id:'d3e2', name:'Supino inclinado halteres', target:'4x 8-10', sets:4},
      {id:'d3e3', name:'Remada unilateral halteres', target:'3x 10-12', sets:3},
      {id:'d3e4', name:'Elevação lateral', target:'4x 12-15', sets:4},
      {id:'d3e5', name:'Crucifixo peck deck', target:'3x 12-15', sets:3},
      {id:'d3e6', name:'Rosca alternada halteres', target:'3x 10-12', sets:3},
      {id:'d3e7', name:'Tríceps francês', target:'3x 10-12', sets:3},
      {id:'d3e8', name:'Prancha lateral', target:'3x/lado', sets:3, core:true},
    ]},
  { id:'d4', label:'D4', name:'Lower B', tag:'Posterior + joelho',
    exercises:[
      {id:'d4e1', name:'Stiff / romeno', target:'4x 8-10', sets:4},
      {id:'d4e2', name:'Passada com halteres', target:'3x 10/perna', sets:3, leg:true},
      {id:'d4e3', name:'Mesa flexora unilateral', target:'3x 10-12/perna', sets:3, leg:true},
      {id:'d4e4', name:'Búlgaro isométrico / hack leve', target:'3x 12', sets:3, leg:true},
      {id:'d4e5', name:'Cadeira abdutora/adutora', target:'3x 15', sets:3},
      {id:'d4e6', name:'Panturrilha sentado', target:'4x 15', sets:4},
      {id:'d4e7', name:'Abdominal infra na paralela', target:'3x 12-15', sets:3, core:true},
      {id:'d4e8', name:'Ponte unilateral', target:'3x 10/lado', sets:3, leg:true},
    ]},
];

let state = { logs:{}, sessions:[], lastLoad:{} };
let currentDay = DAYS[0];
let restEndAt = null;
let restInterval = null;

async function loadState(){
  try{
    const raw = localStorage.getItem('gym-data-v3');
    if(raw){
      state = JSON.parse(raw);
    } else {
      const oldRaw = localStorage.getItem('gym-data-v2') || localStorage.getItem('gym-data');
      if(oldRaw) {
        const parsed = JSON.parse(oldRaw);
        state.lastLoad = parsed.lastLoad || {};
        state.logs = parsed.logs || {};
        state.sessions = parsed.sessions ? (Array.isArray(parsed.sessions) ? parsed.sessions : Object.values(parsed.sessions)) : [];
      }
    }
  }catch(e){}
  render();
}

async function saveState(){
  try{ localStorage.setItem('gym-data-v3', JSON.stringify(state)); }
  catch(e){ console.error(e); }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1500);
}

function todayKey(){ 
  const d = new Date();
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}

function ensureLog(dayId){
  const key = dayId + '_' + new Date().toISOString().slice(0,10);
  if(!state.logs[key]){
    state.logs[key] = {};
    const day = DAYS.find(d=>d.id===dayId);
    day.exercises.forEach(ex=>{
      const defaultLoad = state.lastLoad[ex.id] || '';
      state.logs[key][ex.id] = Array.from({length: ex.sets}, ()=>({load: defaultLoad, done:false}));
    });
  }
  return key;
}

function renderDayNav(){
  const nav = document.getElementById('dayNav');
  nav.innerHTML = '';
  DAYS.forEach(d=>{
    const btn = document.createElement('button');
    btn.textContent = d.label;
    if(d.id === currentDay.id) btn.classList.add('active');
    btn.onclick = ()=>{ currentDay = d; render(); };
    nav.appendChild(btn);
  });
}

function renderFreqTrack(){
  const track = document.getElementById('freqTrack');
  track.innerHTML = '';
  DAYS.forEach(d=>{
    const dot = document.createElement('div');
    const hitRecently = state.sessions.some(s => s.dayId === d.id);
    dot.className = 'dot' + (hitRecently ? ' hit' : '');
    track.appendChild(dot);
  });
}

function bestSetFor(exId){
  let best = null;
  state.sessions.forEach(sess => {
    if(!sess.exercises) return;
    const exData = sess.exercises.find(e => e.id === exId);
    if(exData && exData.load){
      const load = parseFloat(exData.load);
      if(!isNaN(load) && (!best || load > best)) best = load;
    }
  });
  return best;
}

function renderExercises(){
  document.getElementById('dayTitle').textContent = currentDay.name;
  document.getElementById('dayTag').textContent = currentDay.tag;
  const list = document.getElementById('exList');
  list.innerHTML = '';
  const logKey = ensureLog(currentDay.id);

  currentDay.exercises.forEach(ex=>{
    const sets = state.logs[logKey][ex.id];
    const pr = bestSetFor(ex.id);
    const currentGlobalLoad = state.lastLoad[ex.id] || sets[0]?.load || '';

    const card = document.createElement('div');
    card.className = 'ex-card';
    card.innerHTML = `
      <div class="ex-head">
        <div>
          <div class="ex-name">${ex.name}</div>
          <div class="ex-meta">
            <span class="ex-target">${ex.target}</span>
            ${ex.leg ? '<span class="icon"> 🦵</span>' : ''}
            ${ex.core ? '<span class="icon"> 🧘</span>' : ''}
          </div>
        </div>
        <div class="pr-pill">${pr ? `PR <b>${pr}kg</b>` : ''}</div>
      </div>
      <div class="ex-controls">
        <div class="load-input-wrap">
          <input type="number" inputmode="decimal" placeholder="0" value="${currentGlobalLoad}">
          <span class="unit">kg</span>
        </div>
        <div class="series-row"></div>
      </div>
    `;

    const globalInput = card.querySelector('.load-input-wrap input');
    
    globalInput.oninput = (e) => {
      const newLoad = e.target.value;
      state.lastLoad[ex.id] = newLoad;
      sets.forEach(s => { s.load = newLoad; });
      saveState();
    };

    const seriesRow = card.querySelector('.series-row');
    sets.forEach((s, i)=>{
      const btn = document.createElement('button');
      btn.className = 'btn-series' + (s.done ? ' done' : '');
      btn.textContent = `S${i+1}`;
      
      btn.onclick = ()=>{
        s.done = !s.done;
        s.load = globalInput.value || state.lastLoad[ex.id] || '0';

        btn.classList.toggle('done', s.done);
        if(s.done) startRest();
        saveState();
        updateFinishBtn();
        updateETA();
      };
      seriesRow.appendChild(btn);
    });

    list.appendChild(card);
  });
  updateFinishBtn();
  updateETA();
}

function updateFinishBtn(){
  const logKey = ensureLog(currentDay.id);
  const log = state.logs[logKey];
  const anyDone = currentDay.exercises.some(ex => (log[ex.id]||[]).some(s=>s.done));
  document.getElementById('finishBtn').disabled = !anyDone;
}

function updateETA(){
  const logKey = ensureLog(currentDay.id);
  const log = state.logs[logKey];
  let remaining = 0;
  currentDay.exercises.forEach(ex=>{
    (log[ex.id]||[]).forEach(s=>{ if(!s.done) remaining++; });
  });
  const box = document.getElementById('etaTime');
  if(remaining === 0){
    box.textContent = 'concluído';
    return;
  }
  const secondsLeft = remaining * (REST_SECONDS + EXEC_SECONDS);
  const finish = new Date(Date.now() + secondsLeft*1000);
  const hh = String(finish.getHours()).padStart(2,'0');
  const mm = String(finish.getMinutes()).padStart(2,'0');
  box.textContent = `${hh}:${mm}`;
}

function startRest(){
  clearInterval(restInterval);
  restEndAt = Date.now() + REST_SECONDS*1000;
  const bar = document.getElementById('restBar');
  bar.classList.add('show');
  tickRest();
  restInterval = setInterval(tickRest, 1000);
}

function tickRest(){
  const left = Math.max(0, Math.round((restEndAt - Date.now())/1000));
  const m = Math.floor(left/60);
  const s = String(left%60).padStart(2,'0');
  document.getElementById('restTime').textContent = `${m}:${s}`;
  if(left <= 0){
    clearInterval(restInterval);
    document.getElementById('restBar').classList.remove('show');
    if(navigator.vibrate) navigator.vibrate(200);
    showToast('Descanso terminado 🔥');
  }
}

document.getElementById('restBar').onclick = ()=>{
  clearInterval(restInterval);
  document.getElementById('restBar').classList.remove('show');
};

// SALVAMENTO REAL COM TODOS OS EXERCÍCIOS E CARGAS RESPECTIVAS
document.getElementById('finishBtn').onclick = async ()=>{
  const logKey = ensureLog(currentDay.id);
  const completedExercises = [];
  
  currentDay.exercises.forEach(ex=>{
    const sets = state.logs[logKey][ex.id] || [];
    const anySetDone = sets.some(s => s.done);
    
    if(anySetDone) {
      const finalLoad = state.lastLoad[ex.id] || sets[0]?.load || '0';
      completedExercises.push({
        id: ex.id,
        name: ex.name,
        load: finalLoad
      });
    }
  });

  if(completedExercises.length === 0) return;

  const newSession = {
    id: 'sess_' + Date.now(),
    date: todayKey(),
    dayId: currentDay.id,
    dayName: currentDay.name,
    exercises: completedExercises
  };

  state.sessions.unshift(newSession); 

  // Resetar marcações sem limpar os inputs de peso
  currentDay.exercises.forEach(ex => {
    if(state.logs[logKey] && state.logs[logKey][ex.id]) {
      state.logs[logKey][ex.id].forEach(s => { s.done = false; });
    }
  });

  await saveState();
  showToast('Treino registrado com sucesso! 💪');
  renderFreqTrack();
  renderExercises();
};

document.getElementById('resetDayBtn').onclick = ()=>{
  const logKey = ensureLog(currentDay.id);
  if(confirm('Limpar os registros de hoje para este treino?')){
    delete state.logs[logKey];
    saveState();
    renderExercises();
  }
};

// LISTAGEM DO HISTÓRICO COM FUNÇÃO PARA DELETAR ITEM INDIVIDUAL
function renderHistorico(){
  const wrap = document.getElementById('histList');
  wrap.innerHTML = '';
  
  if(state.sessions.length === 0){
    wrap.innerHTML = '<div class="empty">Nenhum treino salvo no histórico ainda.</div>';
    return;
  }
  
  state.sessions.forEach((s)=>{
    const item = document.createElement('div');
    item.className = 'hist-item';
    
    const exListHtml = s.exercises && s.exercises.length > 0
      ? s.exercises.map(e => `<div class="hist-ex-row"><span>${e.name}</span><b>${e.load} kg</b></div>`).join('')
      : `<div style="color:var(--text-dim)">Sem dados de exercícios.</div>`;

    item.innerHTML = `
      <div class="hist-top">
        <div>
          <span class="d">${s.date}</span>
          <div class="n">${s.dayName}</div>
        </div>
        <button class="btn-del" data-id="${s.id}">Apagar</button>
      </div>
      <div class="hist-details">
        ${exListHtml}
      </div>
    `;

    // Ação do Botão Apagar Registro Individual
    item.querySelector('.btn-del').onclick = () => {
      if(confirm(`Deseja mesmo apagar permanentemente o histórico do dia ${s.date}?`)){
        state.sessions = state.sessions.filter(sess => sess.id !== s.id);
        saveState();
        renderHistorico();
        renderFreqTrack();
        showToast('Registro apagado.');
      }
    };

    wrap.appendChild(item);
  });
}

// GERAÇÃO DE GRÁFICOS DINÂMICOS NA ABA PROGRESSO
let activeChartExId = null;

function drawChart(exId, exName) {
  const canvas = document.getElementById('progChart');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  
  const historyData = [];
  const sortedSessions = [...state.sessions].reverse(); // Do mais antigo pro mais novo
  
  sortedSessions.forEach(s => {
    if(!s.exercises) return;
    const match = s.exercises.find(e => e.id === exId);
    if(match) {
      historyData.push({ date: s.date.slice(0,5), load: parseFloat(match.load) || 0 });
    }
  });

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const w = canvas.width = canvas.offsetWidth * window.devicePixelRatio;
  const h = canvas.height = 160 * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

  const cssW = canvas.offsetWidth;
  const cssH = 160;

  if (historyData.length < 1) {
    ctx.fillStyle = '#8D9399';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Realize mais treinos com esse exercício para gerar o gráfico.', cssW/2, cssH/2);
    return;
  }

  const paddingLeft = 35;
  const paddingRight = 25;
  const paddingTop = 25;
  const paddingBottom = 25;
  const graphW = cssW - paddingLeft - paddingRight;
  const graphH = cssH - paddingTop - paddingBottom;

  const loads = historyData.map(d => d.load);
  let maxLoad = Math.max(...loads, 10);
  let minLoad = Math.min(...loads, 0);
  if(maxLoad === minLoad) { maxLoad += 5; minLoad = Math.max(0, minLoad - 5); }
  const range = maxLoad - minLoad;

  // Linhas do Grid Lateral/Fundo
  ctx.strokeStyle = '#33383C';
  ctx.lineWidth = 1;
  ctx.fillStyle = '#8D9399';
  ctx.font = '9px monospace';
  ctx.textAlign = 'right';

  for(let i=0; i<=4; i++) {
    const val = minLoad + (range * (i / 4));
    const y = cssH - paddingBottom - (graphH * (i / 4));
    ctx.beginPath();
    ctx.moveTo(paddingLeft, y);
    ctx.lineTo(cssW - paddingRight, y);
    ctx.stroke();
    ctx.fillText(val.toFixed(0)+'kg', paddingLeft - 6, y + 3);
  }

  // Mapeamento das coordenadas
  const points = [];
  const count = historyData.length;
  historyData.forEach((d, i) => {
    const x = paddingLeft + (count > 1 ? (graphW * (i / (count - 1))) : graphW / 2);
    const y = cssH - paddingBottom - (((d.load - minLoad) / range) * graphH);
    points.push({x, y, label: d.date, val: d.load});
  });

  // Linha amarela de progressão
  ctx.strokeStyle = '#E3A33B';
  ctx.lineWidth = 3;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  points.forEach((p, i) => {
    if(i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  });
  ctx.stroke();

  // Nós e rótulos
  points.forEach(p => {
    ctx.fillStyle = '#6FA88A';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ECE9E4';
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(p.val+'kg', p.x, p.y - 8);

    ctx.fillStyle = '#8D9399';
    ctx.font = '8px monospace';
    ctx.fillText(p.label, p.x, cssH - 8);
  });
}

function selectExerciseForChart(exId, exName) {
  activeChartExId = exId;
  document.querySelectorAll('.pr-card').forEach(c => {
    c.classList.toggle('selected', c.dataset.id === exId);
  });
  const container = document.getElementById('chartContainer');
  container.classList.add('show');
  document.getElementById('chartExName').textContent = `Evolução: ${exName}`;
  drawChart(exId, exName);
}

function renderPRs(){
  const grid = document.getElementById('prGrid');
  grid.innerHTML = '';
  
  const uniqueExercises = new Map();
  DAYS.forEach(day => {
    day.exercises.forEach(ex => {
      uniqueExercises.set(ex.id, ex.name);
    });
  });

  let hasData = false;
  uniqueExercises.forEach((exName, exId) => {
    const pr = bestSetFor(exId);
    if(pr) {
      hasData = true;
      const card = document.createElement('div');
      card.className = 'pr-card' + (activeChartExId === exId ? ' selected' : '');
      card.dataset.id = exId;
      card.innerHTML = `<div class="n">${exName}</div><div class="k">${pr}kg <small style="font-size:9px;color:var(--text-dim)">max</small></div>`;
      
      card.onclick = () => {
        selectExerciseForChart(exId, exName);
      };
      grid.appendChild(card);
    }
  });

  if(!hasData){ 
    grid.innerHTML = '<div class="empty">Nenhum dado para mostrar. Finalize treinos registrando cargas para ver o progresso.</div>'; 
    document.getElementById('chartContainer').classList.remove('show');
  } else if (activeChartExId && uniqueExercises.has(activeChartExId)) {
    drawChart(activeChartExId, uniqueExercises.get(activeChartExId));
  }
}

// COMPORTAMENTO DAS ABAS
document.querySelectorAll('.tabbar button').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.tabbar button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+tab).classList.add('active');
    
    document.getElementById('finishBar').style.display = tab === 'treino' ? 'flex' : 'none';
    document.getElementById('etaBox').style.display = tab === 'treino' ? 'block' : 'none';
    
    if(tab === 'historico') renderHistorico();
    if(tab === 'prs') renderPRs();
  };
});

function render(){
  renderDayNav();
  renderFreqTrack();
  renderExercises();
}

window.onresize = () => {
  if(activeChartExId) {
    const card = document.querySelector(`.pr-card[data-id="${activeChartExId}"]`);
    if(card) {
      const name = card.querySelector('.n').textContent;
      drawChart(activeChartExId, name);
    }
  }
};

loadState();
</script>
