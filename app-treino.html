<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Musculação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16181A; --panel:#1E2124; --panel-2:#262A2D; --line:#33383C;
    --text:#ECE9E4; --text-dim:#8D9399; --accent:#E3A33B; --accent-dim:#7A5A22;
    --ok:#6FA88A; --rest:#C4573F;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; }
  body{ padding-bottom:78px; }
  .mono{ font-family:'JetBrains Mono',monospace; }

  header.top{
    padding:12px 14px 10px; border-bottom:1px solid var(--line);
    background:#16181A; position:sticky; top:0; z-index:20;
  }
  .brand-row{ display:flex; align-items:center; justify-content:space-between; }
  header.top h1{ font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:0.05em; margin:0; }
  header.top h1 span{ color:var(--accent); }
  .sub-row{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
  .sub">Upper/Lower — 4x semana</span>
    <div class="eta" id="etaBox">término ~ <b id="etaTime">--:--</b></div>
  </div>
  <div class="freq-track" id="freqTrack"></div>
</header>

<div id="view-treino" class="view active">
  <nav class="days" id="dayNav"></nav>
  <main>
    <div class="day-title">
      <h2 id="dayTitle"></h2>
      <span class="tag" id="dayTag"></span>
    </div>
    <div id="exList"></div>
  </main>
</div>

<div id="view-historico" class="view">
  <main>
    <div class="day-title"><h2>Histórico</h2></div>
    <div id="histList"></div>
  </main>
</div>

<div id="view-prs" class="view">
  <main>
    <div class="day-title"><h2>Recordes</h2></div>
    <div class="pr-grid" id="prGrid"></div>
  </main>
</div>

<div class="rest-bar" id="restBar">
  <span class="lbl">Descanso — toque para pular</span>
  <span class="time mono" id="restTime">1:30</span>
</div>

<div class="finish-bar" id="finishBar">
  <button class="btn-ghost" id="resetDayBtn">↺</button>
  <button class="btn-primary" id="finishBtn">Concluir treino de hoje</button>
</div>

<div class="toast" id="toast"></div>

<script>
const REST_SECONDS = 90;
const EXEC_SECONDS = 30;

const DAYS = [
  { id:'d1', label:'D1', name:'Upper A', tag:'Peito / Costas — força',
    exercises:[
      {id:'d1e1', name:'Supino reto barra', target:'4x 6-8', sets:4},
      {id:'d1e2', name:'Remada curvada barra', target:'4x 6-8', sets:4},
      {id:'d1e3', name:'Desenvolvimento militar halteres', target:'3x 8-10', sets:3},
      {id:'d1e4', name:'Puxada frente aberta', target:'3x 8-10', sets:3},
      {id:'d1e5', name:'Crucifixo inclinado halteres', target:'3x 10-12', sets:3},
      {id:'d1e6', name:'Rosca direta barra W', target:'3x 10-12', sets:3},
      {id:'d1e7', name:'Tríceps corda', target:'3x 10-12', sets:3},
      {id:'d1e8', name:'Prancha + infra', target:'3x', sets:3, core:true},
    ]},
  { id:'d2', label:'D2', name:'Lower A', tag:'Quadríceps + unilateral',
    exercises:[
      {id:'d2e1', name:'Agachamento livre', target:'4x 6-8', sets:4},
      {id:'d2e2', name:'Afundo búlgaro', target:'3x 8-10/perna', sets:3, leg:true},
      {id:'d2e3', name:'Leg press unilateral', target:'3x 10-12/perna', sets:3, leg:true},
      {id:'d2e4', name:'Cadeira extensora', target:'3x 12-15', sets:3},
      {id:'d2e5', name:'Cadeira flexora', target:'3x 12-15', sets:3},
      {id:'d2e6', name:'Elevação pélvica', target:'3x 10-12', sets:3},
      {id:'d2e7', name:'Panturrilha em pé', target:'4x 12-15', sets:4},
      {id:'d2e8', name:'Abdominal oblíquo', target:'3x 15', sets:3, core:true},
    ]},
  { id:'d3', label:'D3', name:'Upper B', tag:'Ombros / Costas — volume',
    exercises:[
      {id:'d3e1', name:'Barra fixa / puxada supinada', target:'4x 6-10', sets:4},
      {id:'d3e2', name:'Supino inclinado halteres', target:'4x 8-10', sets:4},
      {id:'d3e3', name:'Remada unilateral halteres', target:'3x 10-12', sets:3},
      {id:'d3e4', name:'Elevação lateral', target:'4x 12-15', sets:4},
      {id:'d3e5', name:'Crucifixo peck deck', target:'3x 12-15', sets:3},
      {id:'d3e6', name:'Rosca alternada halteres', target:'3x 10-12', sets:3},
      {id:'d3e7', name:'Tríceps francês', target:'3x 10-12', sets:3},
      {id:'d3e8', name:'Prancha lateral', target:'3x/lado', sets:3, core:true},
    ]},
  { id:'d4', label:'D4', name:'Lower B', tag:'Posterior + joelho',
    exercises:[
      {id:'d4e1', name:'Stiff / romeno', target:'4x 8-10', sets:4},
      {id:'d4e2', name:'Passada com halteres', target:'3x 10/perna', sets:3, leg:true},
      {id:'d4e3', name:'Mesa flexora unilateral', target:'3x 10-12/perna', sets:3, leg:true},
      {id:'d4e4', name:'Búlgaro isométrico / hack leve', target:'3x 12', sets:3, leg:true},
      {id:'d4e5', name:'Cadeira abdutora/adutora', target:'3x 15', sets:3},
      {id:'d4e6', name:'Panturrilha sentado', target:'4x 15', sets:4},
      {id:'d4e7', name:'Abdominal infra na paralela', target:'3x 12-15', sets:3, core:true},
      {id:'d4e8', name:'Ponte unilateral', target:'3x 10/lado', sets:3, leg:true},
    ]},
];

let state = { logs:{}, sessions:{}, lastLoad:{} };
let currentDay = DAYS[0];
let restEndAt = null;
let restInterval = null;

async function loadState(){
  try{
    const raw = localStorage.getItem('gym-data');
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign({ logs:{}, sessions:{}, lastLoad:{} }, parsed);
    }
  }catch(e){}
  render();
}

async function saveState(){
  try{ localStorage.setItem('gym-data', JSON.stringify(state)); }
  catch(e){ console.error('Falha ao salvar', e); }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1500);
}

function todayKey(){ return new Date().toISOString().slice(0,10); }

function ensureLog(dayId){
  const key = dayId + '_' + todayKey();
  if(!state.logs[key]){
    state.logs[key] = {};
    const day = DAYS.find(d=>d.id===dayId);
    day.exercises.forEach(ex=>{
      const defaultLoad = state.lastLoad[ex.id] || '';
      state.logs[key][ex.id] = Array.from({length: ex.sets}, ()=>({load: defaultLoad, done:false}));
    });
  }
  return key;
}

function renderDayNav(){
  const nav = document.getElementById('dayNav');
  nav.innerHTML = '';
  DAYS.forEach(d=>{
    const btn = document.createElement('button');
    btn.textContent = d.label;
    if(d.id === currentDay.id) btn.classList.add('active');
    btn.onclick = ()=>{ currentDay = d; render(); };
    nav.appendChild(btn);
  });
}

function renderFreqTrack(){
  const track = document.getElementById('freqTrack');
  track.innerHTML = '';
  DAYS.forEach(d=>{
    const dot = document.createElement('div');
    const hitRecently = Object.entries(state.sessions).some(([k,s])=> s.dayId===d.id);
    dot.className = 'dot' + (hitRecently ? ' hit' : '');
    track.appendChild(dot);
  });
}

function bestSetFor(exId){
  let best = null;
  Object.values(state.logs).forEach(log=>{
    const sets = log[exId];
    if(!sets) return;
    sets.forEach(s=>{
      if(s.done && s.load){
        const load = parseFloat(s.load);
        if(!isNaN(load) && (!best || load > best)) best = load;
      }
    });
  });
  return best;
}

function renderExercises(){
  document.getElementById('dayTitle').textContent = currentDay.name;
  document.getElementById('dayTag').textContent = currentDay.tag;
  const list = document.getElementById('exList');
  list.innerHTML = '';
  const logKey = ensureLog(currentDay.id);

  currentDay.exercises.forEach(ex=>{
    const sets = state.logs[logKey][ex.id];
    const pr = bestSetFor(ex.id);
    const currentGlobalLoad = sets[0]?.load || state.lastLoad[ex.id] || '';

    const card = document.createElement('div');
    card.className = 'ex-card';
    card.innerHTML = `
      <div class="ex-head">
        <div>
          <div class="ex-name">${ex.name}</div>
          <div class="ex-meta">
            <span class="ex-target">${ex.target}</span>
            ${ex.leg ? '<span class="icon" title="Direita primeiro">🦵</span>' : ''}
            ${ex.core ? '<span class="icon" title="Core">🧘</span>' : ''}
          </div>
        </div>
        <div class="pr-pill">${pr ? `PR <b>${pr}kg</b>` : ''}</div>
      </div>
      <div class="ex-controls">
        <div class="load-input-wrap">
          <input type="number" inputmode="decimal" placeholder="0" value="${currentGlobalLoad}">
          <span class="unit">kg</span>
        </div>
        <div class="series-row" data-ex="${ex.id}"></div>
      </div>
    `;

    const globalInput = card.querySelector('.load-input-wrap input');
    globalInput.oninput = (e) => {
      const newLoad = e.target.value;
      if (newLoad) state.lastLoad[ex.id] = newLoad;
      sets.forEach(s => { s.load = newLoad; });
      saveState();
    };

    const seriesRow = card.querySelector('.series-row');
    sets.forEach((s, i)=>{
      const btn = document.createElement('button');
      btn.className = 'btn-series' + (s.done ? ' done' : '');
      btn.textContent = `S${i+1}`;
      
      btn.onclick = ()=>{
        s.done = !s.done;
        
        if (globalInput.value) {
          sets.forEach(setObj => { setObj.load = globalInput.value; });
        }

        btn.classList.toggle('done', s.done);
        if(s.done) startRest();
        saveState();
        updateFinishBtn();
        updateETA();
      };
      seriesRow.appendChild(btn);
    });

    list.appendChild(card);
  });
  updateFinishBtn();
  updateETA();
}

function updateFinishBtn(){
  const logKey = ensureLog(currentDay.id);
  const log = state.logs[logKey];
  const anyDone = currentDay.exercises.some(ex => (log[ex.id]||[]).some(s=>s.done));
  document.getElementById('finishBtn').disabled = !anyDone;
}

function updateETA(){
  const logKey = ensureLog(currentDay.id);
  const log = state.logs[logKey];
  let remaining = 0;
  currentDay.exercises.forEach(ex=>{
    (log[ex.id]||[]).forEach(s=>{ if(!s.done) remaining++; });
  });
  const box = document.getElementById('etaTime');
  if(remaining === 0){
    box.textContent = 'concluído';
    return;
  }
  const secondsLeft = remaining * (REST_SECONDS + EXEC_SECONDS);
  const finish = new Date(Date.now() + secondsLeft*1000);
  const hh = String(finish.getHours()).padStart(2,'0');
  const mm = String(finish.getMinutes()).padStart(2,'0');
  box.textContent = `${hh}:${mm}`;
}

function startRest(){
  clearInterval(restInterval);
  restEndAt = Date.now() + REST_SECONDS*1000;
  const bar = document.getElementById('restBar');
  bar.classList.add('show');
  tickRest();
  restInterval = setInterval(tickRest, 1000);
}

function tickRest(){
  const left = Math.max(0, Math.round((restEndAt - Date.now())/1000));
  const m = Math.floor(left/60);
  const s = String(left%60).padStart(2,'0');
  document.getElementById('restTime').textContent = `${m}:${s}`;
  if(left <= 0){
    clearInterval(restInterval);
    document.getElementById('restBar').classList.remove('show');
    if(navigator.vibrate) navigator.vibrate(200);
    showToast('Descanso terminado 🔥');
  }
}

document.getElementById('restBar').onclick = ()=>{
  clearInterval(restInterval);
  document.getElementById('restBar').classList.remove('show');
};

document.getElementById('finishBtn').onclick = async ()=>{
  const logKey = ensureLog(currentDay.id);
  let vol = 0;
  currentDay.exercises.forEach(ex=>{
    (state.logs[logKey][ex.id]||[]).forEach(s=>{
      if(s.done && s.load) vol += parseFloat(s.load)||0;
    });
  });
  state.sessions[logKey] = { date: todayKey(), dayId: currentDay.id, dayName: currentDay.name, volume: Math.round(vol) };
  await saveState();
  showToast('Treino registrado 💪');
  renderFreqTrack();
  renderHistorico();
};

document.getElementById('resetDayBtn').onclick = ()=>{
  const logKey = ensureLog(currentDay.id);
  if(confirm('Limpar os registros de hoje para este treino?')){
    delete state.logs[logKey];
    saveState();
    renderExercises();
  }
};

function renderHistorico(){
  const wrap = document.getElementById('histList');
  wrap.innerHTML = '';
  const items = Object.values(state.sessions).sort((a,b)=> a.date < b.date ? 1 : -1);
  if(items.length === 0){
    wrap.innerHTML = '<div class="empty">Nenhum treino concluído ainda.</div>';
    return;
  }
  items.forEach(s=>{
    const item = document.createElement('div');
    item.className = 'hist-item';
    item.innerHTML = `
      <div><div class="d">${s.date}</div><div class="n">${s.dayName}</div></div>
      <div class="v"><b>${s.volume}</b><small>kg somados</small></div>
    `;
    wrap.appendChild(item);
  });
}

function renderPRs(){
  const grid = document.getElementById('prGrid');
  grid.innerHTML = '';
  let any = false;
  DAYS.forEach(day=>{
    day.exercises.forEach(ex=>{
      const pr = bestSetFor(ex.id);
      if(pr){
        any = true;
        const card = document.createElement('div');
        card.className = 'pr-card';
        card.innerHTML = `<div class="n">${ex.name}</div><div class="k">${pr}kg</div>`;
        grid.appendChild(card);
      }
    });
  });
  if(!any){ grid.innerHTML = '<div class="empty">Registre cargas nos treinos para ver seus recordes aqui.</div>'; }
}

document.querySelectorAll('.tabbar button').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.tabbar button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+tab).classList.add('active');
    document.getElementById('finishBar').style.display = tab === 'treino' ? 'flex' : 'none';
    document.getElementById('etaBox').style.display = tab === 'treino' ? 'block' : 'none';
    if(tab === 'historico') renderHistorico();
    if(tab === 'prs') renderPRs();
  };
});

function render(){
  renderDayNav();
  renderFreqTrack();
  renderExercises();
}

loadState();
</script>
</body>
</html>
