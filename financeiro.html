<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finanças App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg-app: #0c0c0e;
            --bg-surface: #16161a;
            --bg-input: #22222a;
            --border: #2c2c35;
            --text-main: #f5f5f7;
            --text-secondary: #a8a8b3;
            --text-muted: #6e6e77;
            
            --brand: #996dff;
            --success: #00b37e;
            --danger: #f75a68;
            --warning: #ffb800;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 40px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        #status-conexao {
            font-size: 0.75rem;
            padding: 6px 12px;
            background: var(--bg-surface);
            border-radius: 20px;
            border: 1px solid var(--border);
            color: var(--warning);
        }

        /* Reduzido o tamanho e espaçamento do card principal */
        .balance-card {
            background: linear-gradient(135deg, #181424 0%, var(--bg-surface) 100%);
            border: 1px solid rgba(153, 109, 255, 0.2);
            border-radius: 16px;
            padding: 18px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .balance-card::after {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 100px;
            height: 100px;
            background: var(--brand);
            filter: blur(50px);
            opacity: 0.25;
        }

        .balance-card p {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .balance-card h2 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 12px;
        }

        .balance-sub {
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }

        .sub-item h4 {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .sub-item span {
            font-size: 0.95rem;
            font-weight: 600;
        }
        .sub-item.pago span { color: var(--success); }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            padding: 12px 16px 12px 40px;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.9rem;
            opacity: 0.6;
        }

        .select-filters {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .select-filters select {
            width: 100%;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23a8a8b3' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 14px;
        }

        .chart-tabs {
            display: flex;
            background: var(--bg-surface);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--bg-input);
            color: var(--text-main);
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .chart-display-wrapper {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            height: 240px;
            position: relative;
        }

        .chart-container {
            width: 100%;
            height: 100%;
            display: none;
        }

        .chart-container.active {
            display: block;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .transaction-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tx-item {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            padding: 12px 14px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tx-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 70%;
        }

        .tx-title {
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tx-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            align-items: center;
        }

        .tx-tag {
            background: var(--bg-input);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.65rem;
            color: var(--text-secondary);
        }

        .tx-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .tx-value {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .tx-status {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .tx-status.pago, .tx-status.efetuado { color: var(--success); }
        .tx-status.pendente { color: var(--danger); }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Finanças</h1>
            <div id="status-conexao">Carregando...</div>
        </header>

        <section class="balance-card">
            <p>Total Geral Gasto</p>
            <h2 id="totalGasto">R$ 0,00</h2>
            
            <div class="balance-sub">
                <div class="sub-item pago">
                    <h4>Pago / Efetuado</h4>
                    <span id="totalPago">R$ 0,00</span>
                </div>
            </div>
        </section>

        <section class="filter-group">
            <div class="search-box">
                <input type="text" id="filtroTexto" placeholder="Buscar por categoria, fornecedor...">
            </div>
            <div class="select-filters">
                <select id="filtroAno">
                    <option value="todos">Todos os Anos</option>
                </select>
                <select id="filtroMes">
                    <option value="todos">Todos os Meses</option>
                    <option value="0">Janeiro</option>
                    <option value="1">Fevereiro</option>
                    <option value="2">Março</option>
                    <option value="3">Abril</option>
                    <option value="4">Maio</option>
                    <option value="5">Junho</option>
                    <option value="6">Julho</option>
                    <option value="7">Agosto</option>
                    <option value="8">Setembro</option>
                    <option value="9">Outubro</option>
                    <option value="10">Novembro</option>
                    <option value="11">Dezembro</option>
                </select>
            </div>
        </section>

        <section style="display: flex; flex-direction: column; gap: 10px;">
            <div class="chart-tabs">
                <button class="tab-btn active" onclick="switchTab(0)">Evolução</button>
                <button class="tab-btn" onclick="switchTab(1)">Categorias</button>
                <button class="tab-btn" onclick="switchTab(2)">Centros</button>
                <button class="tab-btn" onclick="switchTab(3)">Orçamentos</button>
            </div>
            
            <div class="chart-display-wrapper">
                <div class="chart-container active" id="c0"><canvas id="graficoMensal"></canvas></div>
                <div class="chart-container" id="c1"><canvas id="graficoCategorias"></canvas></div>
                <div class="chart-container" id="c2"><canvas id="graficoCentroCusto"></canvas></div>
                <div class="chart-container" id="c3"><canvas id="graficoOrcamentos"></canvas></div>
            </div>
        </section>

        <section>
            <div class="section-title">
                <span>Histórico de Lançamentos</span>
                <span id="qtdeLancamentos" style="font-size: 0.8rem; font-weight: normal;">0 itens</span>
            </div>
            <div class="transaction-list" id="tabelaCorpo"></div>
        </section>
    </div>

    <script>
        async function carregarDados() {
            const URL_DIRETA = "https://script.google.com/macros/s/AKfycbwBBPBmPOy-XMBUaP0JsvY2u5qh6PLdM6Y7B0iZHLmRGbZdLx6rmTexVELTKJYySB15/exec"; 
            const resposta = await fetch(URL_DIRETA);
            return await resposta.json();
        }

        let chartPizza = null, chartBarras = null, chartMensal = null, chartOrcamentos = null;
        let dadosGlobais = [];
        let filtroTextoAtual = "";
        let filtroAnoAtual = "todos";
        let filtroMesAtual = "todos";

        document.addEventListener("DOMContentLoaded", async () => {
            const statusDiv = document.getElementById("status-conexao");
            try {
                dadosGlobais = await carregarDados();
                if (!dadosGlobais || dadosGlobais.length === 0) {
                    statusDiv.innerText = "⚠ Vazio";
                    return;
                }
                statusDiv.style.display = "none";
                
                preencherFiltrosDinamicos(dadosGlobais);

                document.getElementById("filtroTexto").addEventListener("input", (e) => {
                    filtroTextoAtual = e.target.value.toLowerCase().trim();
                    processarPainel(dadosGlobais);
                });

                document.getElementById("filtroAno").addEventListener("change", (e) => {
                    filtroAnoAtual = e.target.value;
                    processarPainel(dadosGlobais);
                });

                document.getElementById("filtroMes").addEventListener("change", (e) => {
                    filtroMesAtual = e.target.value;
                    processarPainel(dadosGlobais);
                });

                processarPainel(dadosGlobais);
            } catch (erro) {
                console.error(erro);
                statusDiv.innerText = "❌ Erro de Conexão";
            }
        });

        function preencherFiltrosDinamicos(dados) {
            const anosDefinidos = new Set();
            
            dados.forEach(item => {
                if (!item.vencimento || item.vencimento === "Vencimento") return;
                let vTexto = item.vencimento.toString().trim();
                if (vTexto.includes("T")) vTexto = vTexto.split("T")[0];
                const partes = vTexto.includes("-") ? vTexto.split("-") : vTexto.split("/");
                
                if (partes.length === 3) {
                    const ano = vTexto.includes("-") ? parseInt(partes[0]) : parseInt(partes[2]);
                    if (!isNaN(ano)) anosDefinidos.add(ano);
                }
            });

            const selectAno = document.getElementById("filtroAno");
            Array.from(anosDefinidos).sort((a, b) => b - a).forEach(ano => {
                const opt = document.createElement("option");
                opt.value = ano;
                opt.textContent = ano;
                selectAno.appendChild(opt);
            });
        }

        function switchTab(index) {
            document.querySelectorAll('.tab-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
            document.querySelectorAll('.chart-container').forEach((cont, i) => cont.classList.toggle('active', i === index));
        }

        function processarPainel(dadosParaExibir) {
            let totalGasto = 0, totalPago = 0;
            const parcelasProcessadas = [];
            const canvasCategoriasObj = {}, centrosObj = {}, mesesCronologicosObj = {}, orcamentosObj = {};
            const mesesAbreviados = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];

            dadosParaExibir.forEach(item => {
                if (!item.dataCompra || item.dataCompra === "Data Compra") return;

                const totalParcelas = parseInt(item.parcela) || 1;
                const valorParcela = Number(item.valor) || 0;
                const categoriaReal = item.categoria && item.categoria.toString().trim() !== "" ? item.categoria.trim() : "Outros";
                const orcamentoReal = item.orcamento && item.orcamento.toString().trim() !== "" ? item.orcamento.trim() : "Não Informado";

                let dataTexto = (item.dataCompra || "").toString().trim();
                let diaBase = 1, mesBase = new Date().getMonth(), anoBase = new Date().getFullYear();

                if (dataTexto) {
                    if (dataTexto.includes("T")) dataTexto = dataTexto.split("T")[0];
                    const partes = dataTexto.includes("-") ? dataTexto.split("-") : dataTexto.split("/");
                    if (partes.length === 3) {
                        if (dataTexto.includes("-")) {
                            anoBase = parseInt(partes[0]); mesBase = parseInt(partes[1]) - 1; diaBase = parseInt(partes[2]);
                        } else {
                            diaBase = parseInt(partes[0]); mesBase = parseInt(partes[1]) - 1; anoBase = parseInt(partes[2]);
                        }
                    }
                }

                const objetoDataCompra = new Date(anoBase, mesBase, diaBase);
                const dataCompraFormatada = `${String(diaBase).padStart(2, '0')}/${String(mesBase + 1).padStart(2, '0')}`;

                let vencimentoTexto = (item.vencimento || "").toString().trim();
                let mesVencimentoBase = mesBase, anoVencimentoBase = anoBase;

                if (vencimentoTexto) {
                    if (vencimentoTexto.includes("T")) vencimentoTexto = vencimentoTexto.split("T")[0];
                    const partesV = vencimentoTexto.includes("-") ? vencimentoTexto.split("-") : vencimentoTexto.split("/");
                    if (partesV.length === 3) {
                        if (vencimentoTexto.includes("-")) {
                            anoVencimentoBase = parseInt(partesV[0]); mesVencimentoBase = parseInt(partesV[1]) - 1;
                        } else {
                            mesVencimentoBase = parseInt(partesV[1]) - 1; anoVencimentoBase = parseInt(partesV[2]);
                        }
                    }
                } else {
                    mesVencimentoBase = mesBase + 1;
                }

                for (let i = 0; i < totalParcelas; i++) {
                    let dataParcela = new Date(anoVencimentoBase, mesVencimentoBase + i, 1);
                    const mesIndexNum = dataParcela.getMonth();
                    const anoNum = dataParcela.getFullYear();
                    const vencimentoFormatado = `${mesesAbreviados[mesIndexNum]}/${String(anoNum).substring(2)}`;

                    if (filtroAnoAtual !== "todos" && anoNum.toString() !== filtroAnoAtual) continue;
                    if (filtroMesAtual !== "todos" && mesIndexNum.toString() !== filtroMesAtual) continue;

                    const fornecedor = (item.fornecedor || "-").toString().toLowerCase();
                    const descText = (item.descricao || "-").toString().toLowerCase();
                    const catText = categoriaReal.toLowerCase();
                    const orcText = orcamentoReal.toLowerCase();
                    
                    if (filtroTextoAtual !== "" && !fornecedor.includes(filtroTextoAtual) && !descText.includes(filtroTextoAtual) && !catText.includes(filtroTextoAtual) && !orcText.includes(filtroTextoAtual)) {
                        continue;
                    }

                    totalGasto += valorParcela;

                    let statusParcela = (item.status || "pendente").toString().trim().toLowerCase();
                    let statusBadgeTexto = item.status || "Pendente";
                    if (i > 0) { statusParcela = "pendente"; statusBadgeTexto = "Pendente"; }

                    if (statusParcela === "pago" || statusParcela === "efetuado") {
                        totalPago += valorParcela;
                    }

                    const descOriginal = item.descricao || "Item";
                    const descCustomizada = totalParcelas > 1 ? `${descOriginal} (${i + 1}/${totalParcelas})` : descOriginal;
                    
                    const centro = item.centroCusto && item.centroCusto.toString().trim() !== "" ? item.centroCusto.trim() : "Geral";
                    const conta = item.conta || "-";
                    
                    canvasCategoriasObj[categoriaReal] = (canvasCategoriasObj[categoriaReal] || 0) + valorParcela;
                    centrosObj[centro] = (centrosObj[centro] || 0) + valorParcela;
                    
                    orcamentosObj[orcamentoReal] = (orcamentosObj[orcamentoReal] || 0) + valorParcela;

                    const chaveCronologica = `${anoNum}-${String(mesIndexNum + 1).padStart(2, '0')}`;
                    if (!mesesCronologicosObj[chaveCronologica]) {
                        mesesCronologicosObj[chaveCronologica] = { labelExibicao: vencimentoFormatado, total: 0 };
                    }
                    mesesCronologicosObj[chaveCronologica].total += valorParcela;

                    parcelasProcessadas.push({
                        dataOrdenacao: objetoDataCompra,
                        dataCompraStr: dataCompraFormatada,
                        vencimentoStr: vencimentoFormatado,
                        fornecedor: item.fornecedor || "-",
                        descricao: descCustomizada,
                        valor: valorParcela,
                        categoria: categoriaReal,
                        conta: conta,
                        statusClasse: statusParcela,
                        statusTexto: statusBadgeTexto
                    });
                }
            });

            parcelasProcessadas.sort((a, b) => b.dataOrdenacao - a.dataOrdenacao);

            const wrapperTabela = parcelasProcessadas.map(p => `
                <div class="tx-item">
                    <div class="tx-left">
                        <span class="tx-title">${p.descricao}</span>
                        <div class="tx-meta">
                            <span>${p.dataCompraStr}</span>
                            <span class="tx-tag" style="background: rgba(153, 109, 255, 0.15); color: #b794ff;">${p.fornecedor}</span>
                            <span class="tx-tag">${p.categoria}</span>
                            <span class="tx-tag">${p.conta}</span>
                        </div>
                    </div>
                    <div class="tx-right">
                        <span class="tx-value">R$ ${p.valor.toFixed(2).replace(".", ",")}</span>
                        <span class="tx-status ${p.statusClasse}">${p.statusTexto}</span>
                    </div>
                </div>
            `);

            document.getElementById("tabelaCorpo").innerHTML = wrapperTabela.join("") || '<p style="text-align:center;color:var(--text-muted);padding:20px;">Nenhum item encontrado</p>';
            document.getElementById("totalGasto").innerText = "R$ " + totalGasto.toLocaleString("pt-BR", { minimumFractionDigits: 2 });
            document.getElementById("qtdeLancamentos").innerText = wrapperTabela.length + " lançamentos";
            document.getElementById("totalPago").innerText = "R$ " + totalPago.toLocaleString("pt-BR", { minimumFractionDigits: 2 });

            atualizarGraficosPainel(canvasCategoriasObj, centrosObj, mesesCronologicosObj, orcamentosObj);
        }

        function atualizarGraficosPainel(canvasCategoriasObj, centrosObj, mesesCronologicosObj, orcamentosObj) {
            const coresPaleta = ['#996dff', '#00b37e', '#f75a68', '#ffb800', '#00d2df', '#ff79c6', '#a8a8b3'];
            const configPadraoScales = {
                x: { grid: { display: false }, ticks: { color: '#6e6e77', font: { size: 10 } } },
                y: { grid: { color: '#22222a' }, ticks: { color: '#6e6e77', font: { size: 10 } } }
            };

            try {
                const chaves = Object.keys(mesesCronologicosObj).sort();
                const labels = chaves.map(c => mesesCronologicosObj[c].labelExibicao);
                const valores = chaves.map(c => mesesCronologicosObj[c].total);

                if (chartMensal) chartMensal.destroy();
                chartMensal = new Chart(document.getElementById('graficoMensal').getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{ data: valores, borderColor: '#996dff', backgroundColor: 'rgba(153, 109, 255, 0.08)', borderWidth: 2.5, fill: true, tension: 0.3, pointRadius: 2 }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: configPadraoScales }
                });
            } catch (e) {}

            try {
                if (chartPizza) chartPizza.destroy();
                chartPizza = new Chart(document.getElementById('graficoCategorias').getContext('2d'), {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(canvasCategoriasObj),
                        datasets: [{ data: Object.values(canvasCategoriasObj), backgroundColor: coresPaleta, borderWidth: 0 }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: '#c5c5d0', font: { size: 10 }, boxWidth: 10 } } } }
                });
            } catch (e) {}

            try {
                if (chartBarras) chartBarras.destroy();
                chartBarras = new Chart(document.getElementById('graficoCentroCusto').getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: Object.keys(centrosObj),
                        datasets: [{ data: Object.values(centrosObj), backgroundColor: '#00b37e', borderRadius: 6, barThickness: 16 }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: configPadraoScales }
                });
            } catch (e) {}

            try {
                if (chartOrcamentos) chartOrcamentos.destroy();
                
                const VALOR_TETO = 8900;
                const datasetsConfig = [];
                let somaAtualOrcamentos = 0;
                
                Object.keys(orcamentosObj).forEach((tipo, index) => {
                    const valor = orcamentosObj[tipo];
                    somaAtualOrcamentos += valor;
                    
                    datasetsConfig.push({
                        label: tipo,
                        data: [valor],
                        backgroundColor: coresPaleta[index % coresPaleta.length],
                        barThickness: 35
                    });
                });
                
                if (somaAtualOrcamentos < VALOR_TETO) {
                    datasetsConfig.push({
                        label: 'Saldo Disponível',
                        data: [VALOR_TETO - somaAtualOrcamentos],
                        backgroundColor: '#2c2c35', 
                        barThickness: 35
                    });
                }

                chartOrcamentos = new Chart(document.getElementById('graficoOrcamentos').getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: ['Orçamentos'],
                        datasets: datasetsConfig
                    },
                    options: {
                        indexAxis: 'y', 
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: { color: '#c5c5d0', font: { size: 10 }, boxWidth: 10 }
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        let label = context.dataset.label || '';
                                        let valor = context.raw || 0;
                                        let pct = ((valor / VALOR_TETO) * 100).toFixed(1);
                                        return `${label}: R$ ${valor.toLocaleString('pt-BR', {minimumFractionDigits: 2})} (${pct}%)`;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                stacked: true,
                                max: Math.max(VALOR_TETO, somaAtualOrcamentos), 
                                grid: { color: '#22222a' },
                                ticks: {
                                    color: '#6e6e77',
                                    font: { size: 10 },
                                    callback: function(value) {
                                        return 'R$ ' + value;
                                    }
                                }
                            },
                            y: {
                                stacked: true,
                                display: false 
                            }
                        }
                    }
                });
            } catch (e) {
                console.error("Erro no gráfico de orçamentos:", e);
            }
        }
    </script>
</body>
</html>
