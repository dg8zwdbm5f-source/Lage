<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finanças App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg-app: #0c0c0e;
            --bg-surface: #16161a;
            --bg-input: #22222a;
            --border: #2c2c35;
            --text-main: #f5f5f7;
            --text-secondary: #a8a8b3;
            --text-muted: #6e6e77;
            
            --brand: #996dff;
            --success: #00b37e;
            --danger: #f75a68;
            --warning: #ffb800;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 40px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        #status-conexao {
            font-size: 0.75rem;
            padding: 6px 12px;
            background: var(--bg-surface);
            border-radius: 20px;
            border: 1px solid var(--border);
            color: var(--warning);
        }

        .balance-card {
            background: linear-gradient(135deg, #181424 0%, var(--bg-surface) 100%);
            border: 1px solid rgba(153, 109, 255, 0.2);
            border-radius: 20px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 12px 24px rgba(0,0,0,0.3);
        }

        .balance-card::after {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 120px;
            height: 120px;
            background: var(--brand);
            filter: blur(60px);
            opacity: 0.3;
        }

        .balance-card p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        .balance-card h2 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 20px;
        }

        .balance-sub {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }

        .sub-item h4 {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .sub-item span {
            font-size: 1rem;
            font-weight: 600;
        }
        .sub-item.pago span { color: var(--success); }
        .sub-item.orcamento span { color: var(--warning); }

        .budget-progress-container {
            margin-top: 14px;
        }
        .budget-progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .progress-bar-bg {
            background: var(--bg-input);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar-fill {
            background: var(--brand);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease-out;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            padding: 14px 16px 14px 44px;
            border-radius: 14px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.95rem;
            opacity: 0.6;
        }

        .chart-tabs {
            display: flex;
            background: var(--bg-surface);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--bg-input);
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .chart-display-wrapper {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 16px;
            height: 260px;
            position: relative;
        }

        .chart-container {
            width: 100%;
            height: 100%;
            display: none;
        }

        .chart-container.active {
            display: block;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .transaction-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tx-item {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            padding: 14px 16px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tx-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 70%;
        }

        .tx-title {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tx-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .tx-tag {
            background: var(--bg-input);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .tx-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .tx-value {
            font-size: 1rem;
            font-weight: 700;
        }

        .tx-status {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .tx-status.pago, .tx-status.efetuado { color: var(--success); }
        .tx-status.pendente { color: var(--danger); }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Finanças</h1>
            <div id="status-conexao">Carregando...</div>
        </header>

        <section class="balance-card">
            <p>Total Geral Gasto</p>
            <h2 id="totalGasto">R$ 0,00</h2>
            
            <div class="balance-sub">
                <div class="sub-item pago">
                    <h4>Pago / Efetuado</h4>
                    <span id="totalPago">R$ 0,00</span>
                </div>
                <div class="sub-item orcamento">
                    <h4>Orçamento Total</h4>
                    <span id="totalOrcamento">R$ 0,00</span>
                </div>
            </div>

            <div class="budget-progress-container">
                <div class="budget-progress-header">
                    <span>Uso do Orçamento</span>
                    <span id="budgetPercent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBarFill"></div>
                </div>
            </div>
        </section>

        <section class="search-box">
            <input type="text" id="filtroTexto" placeholder="Buscar por categoria, fornecedor...">
        </section>

        <section style="display: flex; flex-direction: column; gap: 10px;">
            <div class="chart-tabs">
                <button class="tab-btn active" onclick="switchTab(0)">Evolução</button>
                <button class="tab-btn" onclick="switchTab(1)">Categorias</button>
                <button class="tab-btn" onclick="switchTab(2)">Centros</button>
            </div>
            
            <div class="chart-display-wrapper">
                <div class="chart-container active" id="c0"><canvas id="graficoMensal"></canvas></div>
                <div class="chart-container" id="c1"><canvas id="graficoCategorias"></canvas></div>
                <div class="chart-container" id="c2"><canvas id="graficoCentroCusto"></canvas></div>
            </div>
        </section>

        <section>
            <div class="section-title">
                <span>Histórico de Lançamentos</span>
                <span id="qtdeLancamentos" style="font-size: 0.8rem; font-weight: normal;">0 itens</span>
            </div>
            <div class="transaction-list" id="tabelaCorpo"></div>
        </section>
    </div>

    <script>
        let chartPizza = null, chartBarras = null, chartMensal = null;
        let dadosGlobais = [];
        let filtroTextoAtual = "";

        document.addEventListener("DOMContentLoaded", async () => {
            const statusDiv = document.getElementById("status-conexao");
            
            if (typeof carregarDados !== "function") {
                console.error("Função carregarDados() ausente no api.js.");
                statusDiv.innerText = "❌ Erro API";
                return;
            }

            try {
                dadosGlobais = await carregarDados();
                if (!dadosGlobais || dadosGlobais.length === 0) {
                    statusDiv.innerText = "⚠ Vazio";
                    return;
                }
                statusDiv.style.display = "none";
                
                document.getElementById("filtroTexto").addEventListener("input", (e) => {
                    filtroTextoAtual = e.target.value.toLowerCase().trim();
                    processarPainel(dadosGlobais);
                });

                processarPainel(dadosGlobais);
            } catch (erro) {
                console.error(erro);
                statusDiv.innerText = "❌ Erro de Conexão";
            }
        });

        // Função auxiliar para ler chaves do objeto sem se importar com acentos ou maiúsculas
        function obterValorFlexivel(obj, listaVariacoes, valorPadrao = 0) {
            for (let variacao of listaVariacoes) {
                if (obj[variacao] !== undefined && obj[variacao] !== null) {
                    return obj[variacao];
                }
            }
            // Procura alternativa limpando tudo se não achou direto
            const chaves = Object.keys(obj);
            for (let chave of chaves) {
                const chaveLimpa = chave.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                for (let v of listaVariacoes) {
                    const vLimpa = v.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                    if (chaveLimpa === vLimpa) return obj[chave];
                }
            }
            return valorPadrao;
        }

        function switchTab(index) {
            document.querySelectorAll('.tab-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
            document.querySelectorAll('.chart-container').forEach((cont, i) => cont.classList.toggle('active', i === index));
        }

        function processarPainel(dadosParaExibir) {
            let totalGasto = 0, totalPago = 0, totalOrcamento = 0;
            const parcelasProcessadas = [];
            const canvasCategoriasObj = {}, centrosObj = {}, mesesCronologicosObj = {};
            const mesesAbreviados = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];

            dadosParaExibir.forEach(item => {
                const totalParcelas = parseInt(obterValorFlexivel(item, ['parcela', 'Parcela'], 1)) || 1;
                const valorParcela = Number(obterValorFlexivel(item, ['valor', 'Valor'], 0)) || 0;
                
                // Mapeador flexível para capturar Categoria e Orçamento independente de acento/caixa
                const categoriaRealRaw = obterValorFlexivel(item, ['categoria', 'Categoria', 'CATEGORIA'], 'Outros');
                const categoriaReal = (categoriaRealRaw && typeof categoriaRealRaw === "string" && categoriaRealRaw.trim() !== "") ? categoriaRealRaw.trim() : "Outros";
                
                const valorOrcamento = Number(obterValorFlexivel(item, ['orcamento', 'Orcamento', 'Orçamento', 'ORÇAMENTO'], 0)) || 0;

                let dataTexto = obterValorFlexivel(item, ['dataCompra', 'DataCompra', 'data', 'Data'], "").toString().trim();
                let diaBase = 1, mesBase = new Date().getMonth(), anoBase = new Date().getFullYear();

                if (dataTexto) {
                    if (dataTexto.includes("T")) dataTexto = dataTexto.split("T")[0];
                    const partes = dataTexto.includes("-") ? dataTexto.split("-") : dataTexto.split("/");
                    if (partes.length === 3) {
                        if (dataTexto.includes("-")) {
                            anoBase = parseInt(partes[0]); mesBase = parseInt(partes[1]) - 1; diaBase = parseInt(partes[2]);
                        } else {
                            diaBase = parseInt(partes[0]); mesBase = parseInt(partes[1]) - 1; anoBase = parseInt(partes[2]);
                        }
                    }
                }

                const objetoDataCompra = new Date(anoBase, mesBase, diaBase);
                const dataCompraFormatada = `${String(diaBase).padStart(2, '0')}/${String(mesBase + 1).padStart(2, '0')}`;

                let vencimentoTexto = obterValorFlexivel(item, ['vencimento', 'Vencimento', 'venc', 'Venc'], "").toString().trim();
                let mesVencimentoBase = mesBase, anoVencimentoBase = anoBase;

                if (vencimentoTexto) {
                    if (vencimentoTexto.includes("T")) vencimentoTexto = vencimentoTexto.split("T")[0];
                    const partesV = vencimentoTexto.includes("-") ? vencimentoTexto.split("-") : vencimentoTexto.split("/");
                    if (partesV.length === 3) {
                        if (vencimentoTexto.includes("-")) {
                            anoVencimentoBase = parseInt(partesV[0]); mesVencimentoBase = parseInt(partesV[1]) - 1;
                        } else {
                            mesVencimentoBase = parseInt(partesV[1]) - 1; anoVencimentoBase = parseInt(partesV[2]);
                        }
                    }
                } else {
                    mesVencimentoBase = mesBase + 1;
                }

                for (let i = 0; i < totalParcelas; i++) {
                    let dataParcela = new Date(anoVencimentoBase, mesVencimentoBase + i, 1);
                    const mesNome = mesesAbreviados[dataParcela.getMonth()];
                    const anoNum = dataParcela.getFullYear();
                    const vencimentoFormatado = `${mesNome}/${String(anoNum).substring(2)}`;

                    const fornecedor = obterValorFlexivel(item, ['fornecedor', 'Fornecedor'], "-").toString().toLowerCase();
                    const descText = obterValorFlexivel(item, ['descricao', 'Descricao', 'Descrição'], "-").toString().toLowerCase();
                    const catText = categoriaReal.toLowerCase();
                    
                    if (filtroTextoAtual !== "" && !fornecedor.includes(filtroTextoAtual) && !descText.includes(filtroTextoAtual) && !catText.includes(filtroTextoAtual)) {
                        continue;
                    }

                    totalGasto += valorParcela;
                    totalOrcamento += (valorOrcamento / totalParcelas);

                    let statusParcela = obterValorFlexivel(item, ['status', 'Status'], "pendente").toString().trim().toLowerCase();
                    let statusBadgeTexto = obterValorFlexivel(item, ['status', 'Status'], "Pendente");
                    if (i > 0) { statusParcela = "pendente"; statusBadgeTexto = "Pendente"; }

                    if (statusParcela === "pago" || statusParcela === "efetuado") {
                        totalPago += valorParcela;
                    }

                    const descOriginal = obterValorFlexivel(item, ['descricao', 'Descricao', 'Descrição'], "Item");
                    const descCustomizada = totalParcelas > 1 ? `${descOriginal} (${i + 1}/${totalParcelas})` : descOriginal;
                    
                    const centroCustoRaw = obterValorFlexivel(item, ['centroCusto', 'CentroCusto', 'centro', 'Centro de Custo'], "Geral");
                    const centro = (centroCustoRaw && typeof centroCustoRaw === "string" && centroCustoRaw.trim() !== "") ? centroCustoRaw.trim() : "Geral";
                    const conta = obterValorFlexivel(item, ['conta', 'Conta'], "-");
                    
                    canvasCategoriasObj[categoriaReal] = (canvasCategoriasObj[categoriaReal] || 0) + valorParcela;
                    centrosObj[centro] = (centrosObj[centro] || 0) + valorParcela;

                    const chaveCronologica = `${anoNum}-${String(dataParcela.getMonth() + 1).padStart(2, '0')}`;
                    if (!mesesCronologicosObj[chaveCronologica]) {
                        mesesCronologicosObj[chaveCronologica] = { labelExibicao: vencimentoFormatado, total: 0 };
                    }
                    mesesCronologicosObj[chaveCronologica].total += valorParcela;

                    parcelasProcessadas.push({
                        dataOrdenacao: objetoDataCompra,
                        dataCompraStr: dataCompraFormatada,
                        vencimentoStr: vencimentoFormatado,
                        fornecedor: obterValorFlexivel(item, ['fornecedor', 'Fornecedor'], "-"),
                        descricao: descCustomizada,
                        valor: valorParcela,
                        categoria: categoriaReal,
                        conta: conta,
                        statusClasse: statusParcela,
                        statusTexto: statusBadgeTexto
                    });
                }
            });

            parcelasProcessadas.sort((a, b) => b.dataOrdenacao - a.dataOrdenacao);

            const wrapperTabela = parcelasProcessadas.map(p => `
                <div class="tx-item">
                    <div class="tx-left">
                        <span class="tx-title">${p.fornecedor}</span>
                        <div class="tx-meta">
                            <span>${p.dataCompraStr}</span>
                            <span class="tx-tag">${p.categoria}</span>
                            <span class="tx-tag">${p.conta}</span>
                        </div>
                    </div>
                    <div class="tx-right">
                        <span class="tx-value">R$ ${p.valor.toFixed(2).replace(".", ",")}</span>
                        <span class="tx-status ${p.statusClasse}">${p.statusTexto}</span>
                    </div>
                </div>
            `);

            document.getElementById("tabelaCorpo").innerHTML = wrapperTabela.join("") || '<p style="text-align:center;color:var(--text-muted);padding:20px;">Nenhum item encontrado</p>';
            document.getElementById("totalGasto").innerText = "R$ " + totalGasto.toLocaleString("pt-BR", { minimumFractionDigits: 2 });
            document.getElementById("qtdeLancamentos").innerText = wrapperTabela.length + " lançamentos";
            document.getElementById("totalPago").innerText = "R$ " + totalPago.toLocaleString("pt-BR", { minimumFractionDigits: 2 });
            document.getElementById("totalOrcamento").innerText = "R$ " + totalOrcamento.toLocaleString("pt-BR", { minimumFractionDigits: 2 });

            const porcentagemUso = totalOrcamento > 0 ? Math.min(Math.round((totalGasto / totalOrcamento) * 100), 100) : 0;
            document.getElementById("budgetPercent").innerText = porcentagemUso + "%";
            document.getElementById("progressBarFill").style.width = porcentagemUso + "%";

            if(porcentagemUso >= 100) {
                document.getElementById("progressBarFill").style.backgroundColor = "var(--danger)";
            } else if (porcentagemUso >= 80) {
                document.getElementById("progressBarFill").style.backgroundColor = "var(--warning)";
            } else {
                document.getElementById("progressBarFill").style.backgroundColor = "var(--brand)";
            }

            atualizarGraficosPainel(canvasCategoriasObj, centrosObj, mesesCronologicosObj);
        }

        function atualizarGraficosPainel(canvasCategoriasObj, centrosObj, mesesCronologicosObj) {
            const coresPaleta = ['#996dff', '#00b37e', '#f75a68', '#ffb800', '#00d2df', '#ff79c6', '#a8a8b3'];
            const configPadraoScales = {
                x: { grid: { display: false }, ticks: { color: '#6e6e77', font: { size: 10 } } },
                y: { grid: { color: '#22222a' }, ticks: { color: '#6e6e77', font: { size: 10 } } }
            };

            try {
                const chaves = Object.keys(mesesCronologicosObj).sort();
                const labels = chaves.map(c => mesesCronologicosObj[c].labelExibicao);
                const valores = chaves.map(c => mesesCronologicosObj[c].total);

                if (chartMensal) chartMensal.destroy();
                chartMensal = new Chart(document.getElementById('graficoMensal').getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{ data: valores, borderColor: '#996dff', backgroundColor: 'rgba(153, 109, 255, 0.08)', borderWidth: 2.5, fill: true, tension: 0.3, pointRadius: 2 }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: configPadraoScales }
                });
            } catch (e) {}

            try {
                if (chartPizza) chartPizza.destroy();
                chartPizza = new Chart(document.getElementById('graficoCategorias').getContext('2d'), {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(canvasCategoriasObj),
                        datasets: [{ data: Object.values(canvasCategoriasObj), backgroundColor: coresPaleta, borderWidth: 0 }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: '#c5c5d0', font: { size: 10 }, boxWidth: 10 } } } }
                });
            } catch (e) {}

            try {
                if (chartBarras) chartBarras.destroy();
                chartBarras = new Chart(document.getElementById('graficoCentroCusto').getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: Object.keys(centrosObj),
                        datasets: [{ data: Object.values(centrosObj), backgroundColor: '#00b37e', borderRadius: 6, barThickness: 16 }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: configPadraoScales }
                });
            } catch (e) {}
        }
    </script>
    <script src="js/api.js"></script>
</body>
</html>
